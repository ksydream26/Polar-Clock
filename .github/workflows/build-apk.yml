name: Build Polar Clock APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Prepare download file
        run: cp app/build/outputs/apk/release/app-release.apk PolarClock.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            PolarClock.apk \
            --target "$GITHUB_SHA" \
            --title "Polar Clock 1.1" \
            --notes "Android용 개인 설치 APK입니다." \
            --latest
